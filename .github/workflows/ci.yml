name: IncidentIQ CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend Build, Test & AI Eval Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run Full Backend Test Suite
        run: |
          cd backend
          ./mvnw clean test

      - name: Run AI Evaluation Harness Gate (F14)
        run: |
          cd backend
          ./mvnw test -Peval

      - name: Archive Evaluation Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-report
          path: docs/ai-evaluation.md

  frontend-check:
    name: Frontend Lint, Typecheck & Bundle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint and Typecheck
        run: |
          cd frontend
          npm run lint
          npx tsc --noEmit

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Container Build & Packaging Verification
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: incidentiq-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: incidentiq-frontend:ci-test
